name: Update forecast graphic

on:
  schedule:
    - cron: "5 * * * *"   # every hour at 5 minutes past (times are UTC)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build the graphic
        run: python make_forecast.py

      - name: Save the new image to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast.png
          git diff --cached --quiet || (git commit -m "Update forecast" && git push)
