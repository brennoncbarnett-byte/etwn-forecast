name: Update ETWN forecast graphics

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate branded 7-day forecast
        run: |
          python make_forecast.py

      - name: Generate text-only forecast
        run: |
          python make_text_forecast.py

      - name: Commit generated PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
          git add forecast.png overlay.png text_forecast.png
          git diff --cached --quiet || git commit -m "Update forecast graphics"

      - name: Push updates
        run: |
          git push
